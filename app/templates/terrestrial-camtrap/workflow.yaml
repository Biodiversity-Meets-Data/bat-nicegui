apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: terrestrial-camtrap-
spec:
  arguments:
    parameters:
      - name: url
        description: Direct URL of the Camtrap DP ZIP archive.
        value: "https://ipt.inbo.be/archive.do?r=gmu8_leuven"
  artifactGC:
    forceFinalizerRemoval: true
  podGC:
    strategy: OnWorkflowSuccess
  entrypoint: main-workflow
  templates:
    - name: main-workflow
      steps:
        - - name: download-camtrap
            template: download-camtrap
            arguments:
              parameters:
                - name: url
                  value: "{{workflow.parameters.url}}"
        - - name: summarize-camtrap
            template: summarize-camtrap
            arguments:
              artifacts:
                - name: camtrap-input
                  from: "{{steps.download-camtrap.outputs.artifacts.camtrap-input}}"
        - - name: render-dashboard
            template: render-dashboard
            arguments:
              artifacts:
                - name: camtrap-results
                  from: "{{steps.summarize-camtrap.outputs.artifacts.camtrap-results}}"

    - name: download-camtrap
      inputs:
        parameters:
          - name: url
      container:
        image: "taimurhk/bat-camtrap-s3:latest"
        command: ["Rscript", "/app/scripts/01_download.R"]
        args:
          - "--url={{inputs.parameters.url}}"
        workingDir: /app/scripts
      outputs:
        artifacts:
          - name: camtrap-input
            path: /app/scripts/inputs/camtrap_dp/
            archive:
              none: {}
            artifactGC:
              strategy: OnWorkflowCompletion

    - name: summarize-camtrap
      inputs:
        artifacts:
          - name: camtrap-input
            path: /app/scripts/inputs/camtrap_dp/
      container:
        image: "taimurhk/bat-camtrap-s3:latest"
        command: ["Rscript", "/app/scripts/02_summary.R"]
        workingDir: /app/scripts
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: bmd-dataspace-s3
                key: accessKey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: bmd-dataspace-s3
                key: secretKey
          - name: AWS_DEFAULT_REGION
            value: eu-north-1
          - name: AWS_BUCKET_ADDRESS
            value: s3://bii-bmd-workflow-engine-production
      outputs:
        artifacts:
          - name: camtrap-results
            path: /app/scripts/outputs/
            archive:
              none: {}
            artifactGC:
              strategy: OnWorkflowCompletion

    - name: render-dashboard
      inputs:
        artifacts:
          - name: camtrap-results
            path: /app/scripts/outputs/
      container:
        image: "taimurhk/bat-camtrap-s3:latest"
        command: ["Rscript", "/app/scripts/03_render_dashboard.R"]
        workingDir: /app/scripts
      outputs:
        artifacts:
          - name: dashboard-results
            path: /app/scripts/outputs/
            archive:
              none: {}
