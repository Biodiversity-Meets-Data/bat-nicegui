apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: bmd-workflow-
spec:
  arguments:
    parameters:
      - name: target_species
        description: Catalogue of Life species identifier
        value: "456G3"
      - name: climate_periods
        description: Time period selection
        value: "1981-2010;2071-2100"
      - name: aoi_wkt
        description: Geometry in WKT
        value: "POLYGON ((8.745117 49.21042, 12.788086 49.21042, 12.788086 50.847573, 8.745117 50.847573, 8.745117 49.21042))"

  artifactGC:
    forceFinalizerRemoval: true
  podGC:
    strategy: OnWorkflowSuccess

  entrypoint: main-workflow

  templates:
    - name: main-workflow
      steps:
        - - name: download-occurrences
            template: download-occurrences
            arguments:
              parameters:
                - name: target_species
                  value: "{{workflow.parameters.target_species}}"
        - - name: run-sdm
            template: run-sdm
            arguments:
              artifacts:
                - name: gbif-occurrences
                  from: "{{steps.download-occurrences.outputs.artifacts.gbif-occurrences}}"
              parameters:
                - name: climate_periods
                  value: "{{workflow.parameters.climate_periods}}"
                - name: aoi_wkt
                  value: "{{workflow.parameters.aoi_wkt}}"
        - - name: render-dashboard
            template: render-dashboard
            arguments:
              artifacts:
                - name: sdm-results
                  from: "{{steps.run-sdm.outputs.artifacts.sdm-results}}"

    - name: download-occurrences
      inputs:
        parameters:
          - name: target_species
      container:
        image: "taimurhk/bat-sdm-s3:latest"
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: bmd-dataspace-s3
                key: accessKey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: bmd-dataspace-s3
                key: secretKey
          - name: AWS_DEFAULT_REGION
            value: eu-north-1
          - name: AWS_BUCKET_ADDRESS
            value: s3://bii-bmd-workflow-engine-production
        command: ["Rscript", "/app/scripts/01_download.R"]
        args:
          - "--target_species={{inputs.parameters.target_species}}"
        workingDir: /app/scripts
      outputs:
        artifacts:
          - name: gbif-occurrences
            path: "/app/scripts/outputs/"
            archive:
              none: {}
            artifactGC:
              strategy: OnWorkflowCompletion

    - name: run-sdm
      inputs:
        artifacts:
          - name: gbif-occurrences
            path: /app/scripts/outputs/
        parameters:
          - name: climate_periods
          - name: aoi_wkt
      container:
        image: "taimurhk/bat-sdm-s3:latest"
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: bmd-dataspace-s3
                key: accessKey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: bmd-dataspace-s3
                key: secretKey
          - name: AWS_DEFAULT_REGION
            value: eu-north-1
          - name: AWS_BUCKET_ADDRESS
            value: s3://bii-bmd-workflow-engine-production
        command: ["Rscript", "/app/scripts/02_sdm.R"]
        args:
          - "--climate_periods={{inputs.parameters.climate_periods}}"
          - "--aoi_wkt={{inputs.parameters.aoi_wkt}}"
        workingDir: /app/scripts
      outputs:
        artifacts:
          - name: sdm-results
            path: /app/scripts/outputs/
            archive:
              none: {}
              artifactGC:
                strategy: OnWorkflowCompletion

    - name: render-dashboard
      inputs:
        artifacts:
          - name: sdm-results
            path: /app/scripts/outputs/
      container:
        image: "taimurhk/bat-sdm-s3:latest"
        command: ["Rscript", "/app/scripts/03_render_dashboard.R"]
        workingDir: /app/scripts
      outputs:
        artifacts:
          - name: dashboard-results
            path: /app/scripts/outputs/
            archive:
              none: {}
