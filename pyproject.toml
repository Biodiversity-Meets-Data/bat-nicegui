[project]
name = "bmd-bat-platform"
version = "0.1.4"
description = "BMD BAT entrypoint web application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "nicegui >= 1.4.0",
    "fastapi >= 0.109.0",
    "uvicorn >= 0.27.0",
    # Authentication
    "pyjwt >= 2.8.0",
    "bcrypt == 4.0.1",
    "passlib[bcrypt] >= 1.7.4",
    "python-multipart >= 0.0.6",
    # HTTP Client
    "httpx >= 0.26.0",
    # Utilities
    "python-dotenv >= 1.0.0",
    "jinja2 >= 3.1.3"
]

[dependency-groups]
dev = ["mypy", "ruff", "types-passlib"]

[tool.uv]
# This project is a deployable application, not an importable library, so uv
# should install the dependencies without installing the project itself.
package = false

[tool.mypy]
strict = true      # Use --strict mode for type checking.
mypy_path = "app"  # Add app/ to mypy's module search path.
files = ["app"]    # Directories to type check.
